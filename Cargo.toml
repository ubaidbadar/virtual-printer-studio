[package]
name = "virtual-printer-studio"
version = "0.2.0"
edition = "2024"


[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
notify = "8.2.2"
open = "5.4.5"
png = "0.18.1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
uuid = { version = "1.29.2", features = ["v4"] }
vps-core = { version = "0.2.0", path = "crates/core" }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"

[workspace]
members = ["crates/core"]
resolver = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Com", "UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Services", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[target.'cfg(windows)'.dependencies.slint]
version = "1.18.1"
default-features = false
features = ["system-tray"]
