[package]
name = "vps-port-monitor"
version = "0.2.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[target.'cfg(windows)'.dependencies]
vps-core = { path = "../core" }
serde_json = "1.0.154"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Devices_Communication", "Win32_System_Power", "Win32_System_Registry", "Win32_Graphics_Gdi"] }
