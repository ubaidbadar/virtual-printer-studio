name: Desktop checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: desktop-v2-static
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate Windows PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/qa/check-powershell.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell parser failed.' }
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target/package) { Remove-Item target/package -Recurse -Force }
          New-Item -ItemType Directory -Path target/package -Force
          Copy-Item target/release/virtual-printer-studio.exe,scripts/install.ps1,README.md -Destination target/package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: virtual-printer-studio-windows
          path: target/package/
      - name: Native Windows print integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -App target/release/virtual-printer-studio.exe -TestRoot target/windows-smoke
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-integration-evidence
          path: target/windows-smoke/
          if-no-files-found: ignore
