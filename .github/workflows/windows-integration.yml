name: Windows print integration
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID containing the Windows executable/DLL package to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  print:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: virtual-printer-studio-windows
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/package
      - name: Real Windows printer integration
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -App target/package/virtual-printer-studio.exe -Monitor target/package/vps_port_monitor.dll -TestRoot target/windows-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-integration-evidence
          path: target/windows-smoke/
          if-no-files-found: ignore
