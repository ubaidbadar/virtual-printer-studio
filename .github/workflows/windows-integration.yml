name: Windows print integration
on:
  workflow_dispatch:
concurrency:
  group: windows-print-integration-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  print:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build current application
        run: cargo build --release --locked
      - name: Real Windows printer integration
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -App target/release/virtual-printer-studio.exe -TestRoot target/windows-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-integration-evidence
          path: target/windows-smoke/
          if-no-files-found: ignore
