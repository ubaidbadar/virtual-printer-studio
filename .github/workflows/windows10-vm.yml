name: Windows 10 evaluation VM acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Desktop checks run containing x64 QA build
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  vm:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: virtual-printer-studio-windows
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/qa-package
      - name: Prepare disposable Windows evaluation VM
        run: |
          pip install -r scripts/qa/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage aria2
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          mkdir -p target/win10-vm/pwsh
          aria2c --console-log-level=warn --summary-interval=30 --max-connection-per-server=16 --split=16 --min-split-size=16M --file-allocation=none --timeout=60 --max-tries=3 --retry-wait=5 --dir=target/win10-vm --out=windows.iso 'https://software-download.microsoft.com/download/pr/19044.1288.211006-0501.21h2_release_svc_refresh_CLIENT_LTSC_EVAL_x64FRE_en-us.iso'
          echo 'e4ab2e3535be5748252a8d5d57539a6e59be8d6726345ee10e7afd2cb89fefb5  target/win10-vm/windows.iso' | sha256sum -c -
          curl -fL --retry 3 https://github.com/PowerShell/PowerShell/releases/download/v7.4.13/PowerShell-7.4.13-win-x64.zip -o target/win10-vm/pwsh.zip
          unzip -q target/win10-vm/pwsh.zip -d target/win10-vm/pwsh
      - name: Start unattended Windows 10 acceptance
        run: |
          nohup bash -c 'python -u scripts/qa/windows10-vm.py --work target/win10-vm >target/win10-vm/host-console.log 2>&1; result=$?; echo "$result" >target/win10-vm/host-exit-code' >target/win10-vm/controller.log 2>&1 &
      - name: Collect initial guest boot progress
        run: |
          python - <<'PYTHON'
          import pathlib,time
          for _ in range(30):
              if pathlib.Path('target/win10-vm/host-exit-code').exists(): break
              time.sleep(10)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: windows-10-boot-progress
          path: |
            target/win10-vm/screen.png
            target/win10-vm/vm-platform.json
            target/win10-vm/host-console.log
          if-no-files-found: warn
      - name: Wait for real Windows guest acceptance
        run: |
          python - <<'PYTHON'
          import pathlib,time
          result=pathlib.Path('target/win10-vm/host-exit-code')
          for minute in range(105):
              if result.exists(): break
              print(f'Waiting for guest acceptance: minute {minute+1}',flush=True)
              time.sleep(60)
          else: raise SystemExit('Guest controller did not finish')
          print(pathlib.Path('target/win10-vm/host-console.log').read_text())
          raise SystemExit(int(result.read_text()))
          PYTHON
      - name: Extract guest evidence
        if: always()
        run: |
          mkdir -p target/win10-evidence
          cp target/win10-vm/vm-platform.json target/win10-vm/qemu.log target/win10-vm/screen.png target/win10-vm/host-console.log target/win10-evidence/ || true
          if [ -f target/win10-vm/evidence.zip ]; then python scripts/qa/extract-evidence.py target/win10-vm/evidence.zip target/win10-evidence; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-10-raw-evidence
          path: target/win10-vm/evidence.zip
          if-no-files-found: warn
      - name: Check guest acceptance result
        run: python -c "import json; r=json.load(open('target/win10-evidence/result.json',encoding='utf-8-sig')); print(r); assert r['exit_code']==0"
      - run: pip install -r scripts/qa/requirements.txt
      - name: Independently verify generated PDF contents
        run: python scripts/qa/verify-pdfs.py target/win10-evidence/printing --expected-count 10
      - name: Independently verify the live GUI test PDF
        run: python scripts/qa/verify-pdfs.py target/win10-evidence/live-ui/PDFs --expected-count 1 --marker "Your virtual printer is working."
      - name: Measure reference pixel differences
        run: python scripts/qa/compare-visuals.py --actual target/win10-evidence/visuals --output target/win10-evidence/comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-10-vm-evidence
          path: target/win10-evidence/
          if-no-files-found: error
