name: Apple Silicon macOS
on:
  push:
    branches: [main, apple-silicon]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Apple Silicon host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64-v1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Package native Apple Silicon application
        run: bash scripts/package-macos.sh
      - name: Validate native CUPS printing and recovery
        run: python3 scripts/qa/macos-smoke.py
      - name: Capture actual macOS UI
        run: |
          'target/macos-package/Virtual Printer Studio.app/Contents/MacOS/virtual-printer-studio' --ui-snapshot target/macos-evidence/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualPrinterStudio-AppleSilicon
          path: |
            target/VirtualPrinterStudio-AppleSilicon.dmg
            target/VirtualPrinterStudio-AppleSilicon.zip
            target/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-print-evidence
          path: target/macos-evidence/
          if-no-files-found: ignore
